<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Köszönöm! – TudásTárs tervváltozatok</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: #f4f3f5; color: #26252b; font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 32rem; background: #fff; border: 1px solid #dedce2; border-radius: 12px; padding: 2rem 1.5rem; }
    h1 { font-size: 1.8rem; line-height: 1.15; margin: 0 0 .75rem; }
    p { margin: 0 0 1rem; color: #5c5a64; }
    a { color: #931b27; text-underline-offset: .2em; }
    .gomb { display: inline-flex; align-items: center; min-height: 46px; padding: .65rem 1.15rem; border-radius: 6px; background: #b92432; color: #fff; font-weight: 650; text-decoration: none; }
    .gomb:hover { background: #931b27; }
    :focus-visible { outline: 3px solid #b92432; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Köszönöm a válaszát!</h1>
    <p>Átnézem, és ha kell, átírom a változatokat. Ha közben kérdése lenne, írjon az <a href="mailto:info@webness.hu">info@webness.hu</a> címre.</p>
    <p>Szikora Marcell, Webness</p>
    <a class="gomb" href="/">Vissza a változatokhoz</a>
  </main>
</body>
</html>
